name: Release

# 这个工作流负责“生成版本”和“发布到 npm”，分两个阶段运行：
#
# 阶段一：功能 PR 合并到 main
# - 开发者通过 pnpm changeset 生成 .changeset/*.md，明确选择要发布的包。
# - Changesets 不会根据 Git diff 自动猜测发布哪些包。
# - Action 消费 Changeset，创建或更新一个版本 PR。
# - 版本 PR 中包含 package.json 版本、CHANGELOG 和 pnpm-lock.yaml 的变化。
#
# 阶段二：版本 PR 合并到 main
# - Action 发现已没有待消费的 Changeset，改为执行 publish 命令。
# - 发布前先构建所有包。
# - changeset publish 查询 npm，只发布本地版本号还不存在的公开包。
# - 发布成功后创建 Git 标签和 GitHub Release。
#
# npm 连接方式：Trusted Publishing（OIDC），不使用长期 NPM_TOKEN。
# 首次启用前，需要完成两项仓库外配置：
# 1. GitHub 仓库允许 GitHub Actions 创建 Pull Request。
# 2. 在 npmjs.com 的每一个待发布包中添加 GitHub Actions
#    Trusted Publisher，并填写以下信息：
# - Organization or user: micro-scaff
# - Repository: micro-tools
# - Workflow filename: release.yml
# - Environment: 留空
#
# 发布时的认证链路：
# GitHub 签发短期 OIDC 身份 -> npm 核对组织、仓库和工作流文件
# -> 核对成功后允许本次 npm publish。令牌不会保存到 GitHub Secrets。

on:
  # 功能 PR 和版本 PR 都在合并进 main 后触发此工作流。
  # 两次触发使用同一份配置，Changesets 会自行判断是应该更新版本 PR，还是发布。
  push:
    branches:
      - main
  # 允许在 GitHub Actions 页面手动触发一次。
  # 适合重试网络、npm 或 GitHub 的临时故障，不会强制重发已存在的版本。
  workflow_dispatch:

# 同一 Git ref 的发布任务必须串行执行。
# main 分支的 github.ref 是 refs/heads/main，因此实际分组名为
# release-refs/heads/main。同组新任务会排队，避免同时更新版本 PR 或发布。
concurrency:
  group: release-${{ github.ref }}
  # false 表示不取消正在运行的发布，新任务等待前一个任务结束。
  cancel-in-progress: false

# 这些权限授予 GitHub 自动生成的 GITHUB_TOKEN，无需手动创建该 Token。
permissions:
  # 允许 Action 提交版本变更，以及创建 Git 标签和 GitHub Release。
  contents: write
  # 允许工作流请求一次性 GitHub OIDC 身份，供 npm 验证。
  id-token: write
  # 允许 Changesets Action 创建或更新版本 PR。
  pull-requests: write

jobs:
  release:
    # GitHub Actions 页面中显示的 Job 名称。
    name: Version or publish packages
    # npm Trusted Publishing 需要使用 GitHub 托管的 runner。
    runs-on: ubuntu-latest
    # 构建或发布超过 30 分钟时终止，避免异常任务长时间占用队列。
    timeout-minutes: 30

    steps:
      # 将当前仓库代码检出到 runner。
      # fetch-depth: 0 表示拉取完整 Git 历史和标签，避免浅克隆影响版本和标签操作。
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 安装 pnpm，版本与根目录 package.json 中的 packageManager 保持一致。
      # run_install: false 表示这一步只安装 pnpm，依赖由后面的独立步骤安装。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
          run_install: false

      # 安装 Node.js，并开启 pnpm 依赖缓存。这里缓存的是 pnpm store，不是 node_modules。
      # registry-url 会生成指向 npm 官方仓库的项目级 .npmrc。
      # 这里只配置仓库地址；身份认证会在 npm publish 时通过 OIDC 完成。
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # npm Trusted Publishing 需要支持 OIDC 的新版 npm CLI。
      # 固定在 npm 11 主版本，避免 npm@latest 在未来自动跨越主版本。
      - name: Install npm 11 for trusted publishing
        run: npm install --global npm@11

      # 按 pnpm-lock.yaml 精确安装依赖。
      # frozen-lockfile 会在 package.json 和 lockfile 不一致时直接失败，防止 CI 暗中改锁文件。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Changesets Action 自动使用 GitHub 提供的 GITHUB_TOKEN，不需要在 env 中再声明。
      # 当 .changeset/ 中存在待处理文件时：
      # - 执行 version:packages。
      # - 更新包版本、CHANGELOG、内部依赖和 pnpm-lock.yaml。
      # - 使用下方的 commit 和 title 创建或更新版本 PR。
      #
      # 当版本 PR 已合并，并且没有待处理 Changeset 时：
      # - 执行 publish:ci，先构建所有包，再运行 changeset publish。
      # - npm CLI 使用 id-token: write 获取短期 OIDC 身份，无需 NPM_TOKEN。
      # - createGithubReleases: true 使发布成功的包同时生成 GitHub Release。
      #
      # 仓库使用 @changesets/cli 2.x，因此这里使用兼容的 changesets/action@v1。
      - name: Create release pull request or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run publish:ci
          commit: "chore: release packages"
          title: "chore: release packages"
          createGithubReleases: true
